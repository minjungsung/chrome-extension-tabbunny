<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TabShelf</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>TabShelf</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">TAB COLLECTIONS</div><h2>Keep your next task ready.</h2><p class="muted">Save the current window without closing your tabs.</p><label for="name">Collection name</label><div class="row"><input id="name" maxlength="80" placeholder="Research, weekend plans..."><button id="save" class="primary">Save tabs</button></div><label for="search">Find a collection</label><input id="search" type="search" placeholder="Search names or saved links"><div id="collections" class="cards"></div><div class="row" style="margin-top:14px"><button id="export" class="small">Export backup</button><button id="import" class="small">Import backup</button></div><input type="file" id="file" accept=".json" hidden><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.0.0</span></footer><script type="module" src="popup.js"></script></body></html>
