<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TabBunny</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>TabBunny</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="hero"><img src="icons/icon128.png" alt="A small bunny guarding your tabs"><div><div class="eyebrow">A HOME FOR YOUR TABS</div><h2>Done for now?<br>Keep your place.</h2></div></div><section class="daily-card"><p class="muted" id="window-summary">Reading your web tabs…</p><button id="quick-save" class="primary full" disabled>Save this window</button><p class="muted">No naming needed. Your tabs stay open.</p><div id="recent-session" hidden><span class="eyebrow">PICK UP WHERE YOU LEFT OFF</span><p id="recent-description"></p><button id="resume" class="full">Resume latest window</button></div></section><details id="organizer"><summary>Choose tabs, name a project, or browse backups</summary><div class="tabs"><button id="view-live" class="selected">Open tabs</button><button id="view-saved">Saved burrows</button></div><section id="live-view"><label for="live-search">Find an open tab</label><input id="live-search" type="search" placeholder="Search titles or domains"><div class="row selection-bar"><button id="select-all" class="quiet small">Select visible</button><span id="selected-count" class="muted"></span></div><div id="live-tabs" class="live-tabs"></div><label for="name">Burrow name</label><input id="name" maxlength="80" placeholder="Project research, weekend reads…"><label class="check"><input id="close-after" type="checkbox">Close selected tabs after saving</label><button id="save" class="primary full">Save selected tabs</button></section><section id="saved-view" hidden><label for="search">Search saved burrows</label><input id="search" type="search" placeholder="Search burrows and saved links"><div id="collections" class="cards"></div><div class="row" style="margin-top:14px"><button id="export" class="small">Export backup</button><button id="import" class="small">Import backup</button></div><input type="file" id="file" accept=".json" hidden></section></details><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.2.0</span></footer><script type="module" src="popup.js"></script></body></html>
